<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>loop assignment  </h1>
    <p>This is a simple loop assignment.</p>
    <p>for loop:  while loop    and do-while loop</p>
</body>
<script>
        {
            for (let i = 0; i < 10; i++) {
                console.log(i);
            }
        }

        {
            for (let i = 2; i <= 20; i += 2) {
                console.log(i);
            }
        }

        {
            for (let i = 1; i <= 10; i++) {
                console.log(`5 x ${i} = ${5 * i}`);
            }
        }

        {
            let sum = 0;
            for (let i = 1; i <= 50; i++) {
                sum += i;
            }
            console.log("Sum =", sum);
        }

        {
            for (let i = 10; i >= 1; i--) {
                console.log(i);
            }
        }

        {
            let i = 1;
            while (i <= 10) {
                console.log(i);
                i++;
            }
        }

        {
            let i = 1;
            while (i <= 20) {
                if (i % 2 !== 0) {
                    console.log(i);
                }
                i++;
            }
        }

        {
            let i = 1;
            let sum = 0;
            while (i <= 100) {
                sum += i;
                i++;
            }
            console.log("Sum:", sum);
        }

        {
            let i = 10;
            while (i >= 1) {
                console.log(i);
                i--;
            }
        }

        {
            let password = "";
            while (password !== "admin123") {
                password = prompt("Enter password:");
            }
            console.log("Access granted!");
        }
    </script>
</html>
